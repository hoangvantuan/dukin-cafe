# Chạy: cp .env.example .env, sửa giá trị, rồi `docker compose up -d --build`
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Cần ADMIN_PASSWORD trong .env}
      SESSION_SECRET: ${SESSION_SECRET:?Cần SESSION_SECRET trong .env}
      TEAMS_WEBHOOK_SECRET: ${TEAMS_WEBHOOK_SECRET:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Cần DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
